<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suprema Corte FC — Estatísticas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">

  <header class="topo">
    <div>
      <div class="topo__marca">Suprema Corte FC</div>
      <div class="topo__subtitulo">Sistema de estatísticas</div>
    </div>
    <div class="topo__selo">SC</div>
  </header>

  <nav class="nav">
    <button class="nav__item" data-secao="jogadores">Processo nº 001 — Jogadores</button>
    <button class="nav__item" data-secao="partidas">Processo nº 002 — Partidas</button>
    <button class="nav__item ativo" data-secao="dashboard">Processo nº 003 — Dashboard</button>
  </nav>

  <main class="conteudo">

    <!-- ===================== DASHBOARD ===================== -->
    <section id="secao-dashboard" class="secao ativa">
      <div class="secao__cabecalho">
        <h1 class="secao__titulo">Súmula da temporada</h1>
      </div>

      <div id="dash-destaques" class="grid-cards"></div>

      <div class="card" style="margin-bottom:20px;">
        <p class="card__rotulo" style="margin-bottom:12px;">Desempenho do time</p>
        <div id="dash-desempenho" class="desempenho"></div>
      </div>

      <div class="grid-cards" style="grid-template-columns: 1fr 1fr;">
        <div>
          <p class="card__rotulo">Próximas partidas</p>
          <div id="dash-proximas" class="lista"></div>
        </div>
        <div>
          <p class="card__rotulo">Últimos resultados</p>
          <div id="dash-resultados" class="lista"></div>
        </div>
      </div>
    </section>

    <!-- ===================== JOGADORES ===================== -->
    <section id="secao-jogadores" class="secao">
      <div class="secao__cabecalho">
        <h1 class="secao__titulo">Jogadores</h1>
        <button class="btn btn--primario" id="btn-novo-jogador">Novo jogador</button>
      </div>

      <div class="filtros">
        <input type="text" id="filtro-busca-jogador" placeholder="Buscar por nome">
        <select id="filtro-posicao">
          <option value="">Todas as posições</option>
          <option value="goleiro">Goleiro</option>
          <option value="zagueiro">Zagueiro</option>
          <option value="lateral">Lateral</option>
          <option value="meio">Meio</option>
          <option value="atacante">Atacante</option>
        </select>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--cinza-texto);">
          <input type="checkbox" id="filtro-inativos"> Mostrar inativos
        </label>
      </div>

      <div id="lista-jogadores" class="lista"></div>
    </section>

    <!-- ===================== PARTIDAS ===================== -->
    <section id="secao-partidas" class="secao">
      <div class="secao__cabecalho">
        <h1 class="secao__titulo">Partidas</h1>
        <button class="btn btn--primario" id="btn-nova-partida">Nova partida</button>
      </div>

      <div class="filtros">
        <select id="filtro-status-partida">
          <option value="">Todos os status</option>
          <option value="agendada">Agendada</option>
          <option value="realizada">Realizada</option>
          <option value="cancelada">Cancelada</option>
        </select>
      </div>

      <div id="lista-partidas" class="lista"></div>
    </section>

  </main>
</div>

<!-- ===================== MODAL: JOGADOR ===================== -->
<div class="modal-fundo" id="modal-jogador">
  <div class="modal">
    <h2 class="modal__titulo" id="titulo-modal-jogador">Novo jogador</h2>
    <form id="form-jogador">
      <input type="hidden" id="jogador-id">
      <div class="campo">
        <label for="jogador-nome">Nome</label>
        <input type="text" id="jogador-nome" required>
      </div>
      <div class="linha-campos">
        <div class="campo">
          <label for="jogador-apelido">Apelido</label>
          <input type="text" id="jogador-apelido">
        </div>
        <div class="campo">
          <label for="jogador-numero">Número da camisa</label>
          <input type="number" id="jogador-numero" min="0">
        </div>
      </div>
      <div class="linha-campos">
        <div class="campo">
          <label for="jogador-posicao">Posição</label>
          <select id="jogador-posicao" required>
            <option value="goleiro">Goleiro</option>
            <option value="zagueiro">Zagueiro</option>
            <option value="lateral">Lateral</option>
            <option value="meio">Meio</option>
            <option value="atacante">Atacante</option>
          </select>
        </div>
        <div class="campo">
          <label for="jogador-nascimento">Data de nascimento</label>
          <input type="date" id="jogador-nascimento">
        </div>
      </div>
      <div class="campo">
        <label style="display:flex;align-items:center;gap:6px;">
          <input type="checkbox" id="jogador-ativo" checked style="width:auto;"> Jogador ativo
        </label>
      </div>
      <div class="modal__acoes">
        <button type="button" class="btn" id="btn-excluir-jogador" style="display:none;margin-right:auto;" data-role="excluir">Excluir</button>
        <button type="button" class="btn" data-fechar-modal="modal-jogador">Cancelar</button>
        <button type="submit" class="btn btn--primario">Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- ===================== MODAL: PARTIDA ===================== -->
<div class="modal-fundo" id="modal-partida">
  <div class="modal modal--largo">
    <h2 class="modal__titulo" id="titulo-modal-partida">Nova partida</h2>
    <form id="form-partida">
      <input type="hidden" id="partida-id">
      <div class="linha-campos">
        <div class="campo">
          <label for="partida-data">Data</label>
          <input type="date" id="partida-data" required>
        </div>
        <div class="campo">
          <label for="partida-adversario">Adversário</label>
          <input type="text" id="partida-adversario" required>
        </div>
      </div>
      <div class="linha-campos">
        <div class="campo">
          <label for="partida-local">Local</label>
          <select id="partida-local" required>
            <option value="casa">Casa</option>
            <option value="fora">Fora</option>
          </select>
        </div>
        <div class="campo">
          <label for="partida-status">Status</label>
          <select id="partida-status">
            <option value="agendada">Agendada</option>
            <option value="realizada">Realizada</option>
            <option value="cancelada">Cancelada</option>
          </select>
        </div>
      </div>
      <div class="linha-campos">
        <div class="campo">
          <label for="partida-placar-suprema">Gols Suprema Corte</label>
          <input type="number" id="partida-placar-suprema" min="0" value="0">
        </div>
        <div class="campo">
          <label for="partida-placar-adversario">Gols adversário</label>
          <input type="number" id="partida-placar-adversario" min="0" value="0">
        </div>
      </div>
      <div class="campo">
        <label for="partida-campeonato">Campeonato ou amistoso</label>
        <input type="text" id="partida-campeonato">
      </div>
      <div class="campo">
        <label for="partida-observacoes">Observações</label>
        <textarea id="partida-observacoes"></textarea>
      </div>

      <div id="bloco-estatisticas" style="display:none;">
        <p class="card__rotulo" style="margin-top:18px;">Estatísticas dos jogadores</p>
        <div style="overflow-x:auto;">
          <table class="tabela-stats">
            <thead>
              <tr>
                <th>Jogador</th>
                <th>Titular</th>
                <th>Min.</th>
                <th>Gols</th>
                <th>Assist.</th>
                <th>C. am.</th>
                <th>C. verm.</th>
                <th>Defesas</th>
                <th>Gols sofr.</th>
              </tr>
            </thead>
            <tbody id="tabela-estatisticas-corpo"></tbody>
          </table>
        </div>
      </div>

      <div class="modal__acoes">
        <button type="button" class="btn" data-role="excluir" id="btn-excluir-partida" style="display:none;margin-right:auto;">Excluir</button>
        <button type="button" class="btn" data-fechar-modal="modal-partida">Cancelar</button>
        <button type="submit" class="btn btn--primario">Salvar</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/jogadores.js"></script>
<script src="js/partidas.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/app.js"></script>
</body>
</html>
